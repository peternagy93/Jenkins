version: '3.7'

services:
  jenkins:
    container_name: my_jenkins_01
    image: jenkins/jenkins:latest
    environment:
      TZ: "Europe/Bucharest"
    ports:
      - "60180:8080"
      - "5000:5000"
    volumes:
      - jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins: